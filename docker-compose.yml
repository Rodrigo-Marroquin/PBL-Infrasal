services:
  api:
    build: .
    image: imacasa-mock:1.0.0
    container_name: imacasa-api
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

# El túnel corre en el host con el ngrok ya autenticado (el token no se guarda en el repo):
#   ngrok http 8000 --url=finalize-ruckus-spirited.ngrok-free.dev
