<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#374151"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9ca3af" stroke-width="2"/></pattern>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#111827">A · Corte longitudinal de la cabina (vista frontal)</text>
  <text x="30" y="56" fill="#6b7280">Escala horizontal 1 px ≈ 1 mm · altura comprimida (no a escala vertical)</text>

  <!-- Estructura -->
  <rect x="80" y="80" width="800" height="500" fill="#f9fafb" stroke="#111827" stroke-width="6"/>
  <text x="520" y="72" fill="#6b7280" font-size="12">Perfil de aluminio 40×40 · paneles negros mate (bloquean luz ambiente)</text>

  <!-- Cono de visión CAM-1 -->
  <polygon points="480,150 140,510 820,510" fill="#3b82f6" fill-opacity=".09" stroke="#3b82f6" stroke-dasharray="6 5"/>

  <!-- CAM-1 -->
  <rect x="456" y="96" width="48" height="36" rx="4" fill="#2563eb"/>
  <rect x="466" y="132" width="28" height="18" fill="#1e3a8a"/>
  <rect x="462" y="150" width="36" height="5" fill="#7c3aed"/>
  <line x1="456" y1="112" x2="420" y2="112" stroke="#374151"/>
  <g text-anchor="end">
  <text x="414" y="108" font-weight="700" fill="#1e3a8a">CAM-1 cenital</text>
  <text x="414" y="125" fill="#374151" font-size="12">Basler a2A4096-9gcBAS · 12 MP · obturador global</text>
  <text x="414" y="140" fill="#374151" font-size="12">lente 16 mm + <tspan fill="#7c3aed" font-weight="700">polarizador</tspan></text>
  </g>

  <!-- L1 paneles difusos a ±45° -->
  <g transform="rotate(35 200 175)"><rect x="130" y="168" width="150" height="16" rx="3" fill="#fde68a" stroke="#d97706"/><rect x="130" y="184" width="150" height="4" fill="#7c3aed"/></g>
  <g transform="rotate(-35 760 175)"><rect x="680" y="168" width="150" height="16" rx="3" fill="#fde68a" stroke="#d97706"/><rect x="680" y="184" width="150" height="4" fill="#7c3aed"/></g>
  <text x="100" y="250" font-weight="700" fill="#b45309">L1 · paneles LED difusos 6000 K</text>
  <text x="100" y="267" fill="#374151" font-size="12">a ±45°, fuera del cono de visión</text>
  <text x="100" y="282" fill="#7c3aed" font-size="12">+ film polarizador (cruzado 90° con el del lente)</text>

  <!-- L2 barras rasantes (detrás) -->
  <rect x="120" y="452" width="720" height="10" rx="3" fill="#fde68a" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="540" y="445" fill="#b45309" font-weight="700" font-size="13">L2 · barras LED rasantes 15–20° (a ambos lados, ver corte B)</text>

  <!-- Machete de perfil -->
  <rect x="150" y="490" width="12" height="20" fill="#6b7280"/>
  <text x="122" y="482" fill="#374151" font-size="12">tope</text>
  <path d="M164 492 Q160 500 164 508 L344 506 L350 496 L344 492 Z" fill="#1f2937"/>
  <path d="M350 500 L760 498 Q800 499 806 503 L350 504 Z" fill="#9ca3af" stroke="#6b7280"/>
  <circle cx="420" cy="509" r="3" fill="#6b7280"/><circle cx="640" cy="509" r="3" fill="#6b7280"/>
  <text x="240" y="485" fill="#111827" font-size="12" font-weight="600">cacha</text>
  <text x="560" y="492" fill="#111827" font-size="12" font-weight="600">hoja</text>

  <!-- Placa y backlight -->
  <rect x="110" y="510" width="740" height="10" fill="#e5e7eb" stroke="#6b7280"/>
  <rect x="805" y="510" width="40" height="10" fill="#111827"/><rect x="113" y="510" width="30" height="10" fill="#111827"/>
  <rect x="110" y="524" width="740" height="20" fill="#fef3c7" stroke="#d97706"/>
  <text x="130" y="539" fill="#92400e" font-size="12" font-weight="700">L3 · backlight LED bajo placa de acrílico esmerilado (silueta)</text>
  <rect x="110" y="548" width="740" height="28" fill="url(#hatch)"/>

  <!-- Cotas -->
  <line x1="140" y1="600" x2="820" y2="600" stroke="#374151" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="400" y="620" fill="#111827" font-weight="700">FOV horizontal ≈ 680 mm</text>
  <line x1="900" y1="150" x2="900" y2="510" stroke="#374151" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="908" y="320" fill="#111827" font-weight="700" transform="rotate(90 908 320)">WD ≈ 970 mm</text>
  <line x1="80" y1="640" x2="880" y2="640" stroke="#9ca3af" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="400" y="660" fill="#6b7280">ancho exterior ≈ 800 mm · alto ≈ 1250 mm · fondo ≈ 600 mm</text>

  <!-- Marcador ArUco -->
  <line x1="825" y1="512" x2="800" y2="390" stroke="#374151"/>
  <g text-anchor="end">
  <text x="860" y="365" fill="#111827" font-size="12" font-weight="700">ArUco 40 mm</text>
  <text x="860" y="380" fill="#374151" font-size="12">(×2, esquinas de la placa)</text>
  </g>
</svg>
